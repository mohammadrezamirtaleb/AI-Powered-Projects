[metadata]
name = facevision-pro
version = 1.0.0
description = Professional real-time face analysis Computer Vision toolkit
long_description = file: README.md
long_description_content_type = text/markdown
author = FaceVision Pro Contributors
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Image Recognition
keywords = computer vision, face detection, face recognition, emotion detection, OpenCV, MediaPipe, DeepFace
url = https://github.com/yourusername/FaceVisionPro
project_urls =
    Documentation = https://github.com/yourusername/FaceVisionPro#readme
    Source = https://github.com/yourusername/FaceVisionPro
    Tracker = https://github.com/yourusername/FaceVisionPro/issues

[options]
packages = find:
python_requires = >=3.9
install_requires =
    opencv-python>=4.8.0
    numpy>=1.24.0
    mediapipe>=0.10.0
    deepface>=0.0.90
    PyYAML>=6.0
    streamlit>=1.30.0
    python-dotenv>=1.0.0
    face-recognition>=1.3.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    mypy>=1.5.0
    pre-commit>=3.4.0

[options.entry_points]
console_scripts =
    facevision-webcam = scripts.run_webcam:main
    facevision-image = scripts.run_image:main
    facevision-enroll = scripts.enroll_face:main
    facevision-dashboard = facevision.dashboard.app:main
    facevision-download-models = scripts.download_models:main

[options.package_data]
facevision =
    configs/*.yaml

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
