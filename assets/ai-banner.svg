<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep AI Purple/Blue) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="50%" stop-color="#140a28" />
      <stop offset="100%" stop-color="#050510" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f093fb">
        <animate attributeName="stop-color" values="#f093fb;#f5576c;#f093fb" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#4facfe" opacity="0.15" />
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .bg-rect { fill: url(#bg); }
      .grid { fill: url(#dotGrid); }
      
      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: url(#aiGrad);
        text-anchor: middle;
        letter-spacing: 2px;
        filter: drop-shadow(0px 0px 12px rgba(240, 147, 251, 0.4));
      }

      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        fill: #a8b2d1;
        text-anchor: middle;
        letter-spacing: 4px;
        opacity: 0;
        animation: fadeIn 1s ease-out 0.5s forwards;
      }

      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #00f2fe;
        font-weight: 700;
        text-anchor: middle;
        opacity: 0;
        animation: slideUp 0.8s ease-out 1s forwards;
      }

      .node {
        fill: #00f2fe;
        animation: pulseNode 2s infinite alternate;
      }

      .connection {
        stroke: #4facfe;
        stroke-width: 1.5;
        opacity: 0.25;
      }

      .data-packet {
        fill: #f093fb;
        filter: drop-shadow(0px 0px 5px #f093fb);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulseNode {
        0% { r: 2; opacity: 0.5; }
        100% { r: 4.5; opacity: 1; filter: drop-shadow(0px 0px 6px #00f2fe); }
      }
      
      .scan-line {
        fill: #00f2fe;
        opacity: 0.1;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" class="bg-rect" rx="12" ry="12" />
  <rect width="100%" height="100%" class="grid" rx="12" ry="12" />

  <!-- Animated Scanner Line -->
  <rect x="0" y="0" width="800" height="2" class="scan-line">
    <animate attributeName="y" values="0;250;0" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Neural Network (Left Side) -->
  <g transform="translate(120, 115)">
    <!-- Connections -->
    <path d="M -60 -40 L -20 0" class="connection" />
    <path d="M -60 40 L -20 0" class="connection" />
    <path d="M -20 0 L 20 -30" class="connection" />
    <path d="M -20 0 L 20 30" class="connection" />
    <path d="M 20 -30 L 50 0" class="connection" />
    <path d="M 20 30 L 50 0" class="connection" />

    <!-- Data Packets -->
    <circle r="2" class="data-packet">
      <animateMotion path="M -60 -40 L -20 0" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M -60 40 L -20 0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M -20 0 L 20 -30" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M 20 30 L 50 0" dur="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Nodes -->
    <circle cx="-60" cy="-40" class="node" style="animation-delay: 0s;" />
    <circle cx="-60" cy="40" class="node" style="animation-delay: 1s;" />
    <circle cx="-20" cy="0" class="node" style="animation-delay: 0.5s;" />
    <circle cx="20" cy="-30" class="node" style="animation-delay: 1.5s;" />
    <circle cx="20" cy="30" class="node" style="animation-delay: 0.8s;" />
    <circle cx="50" cy="0" class="node" style="animation-delay: 2s;" />
  </g>

  <!-- Neural Network (Right Side) -->
  <g transform="translate(680, 115)">
    <!-- Connections -->
    <path d="M 60 -40 L 20 0" class="connection" />
    <path d="M 60 40 L 20 0" class="connection" />
    <path d="M 20 0 L -20 -30" class="connection" />
    <path d="M 20 0 L -20 30" class="connection" />
    <path d="M -20 -30 L -50 0" class="connection" />
    <path d="M -20 30 L -50 0" class="connection" />

    <!-- Data Packets -->
    <circle r="2" class="data-packet">
      <animateMotion path="M 60 -40 L 20 0" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M 60 40 L 20 0" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M 20 0 L -20 30" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="2" class="data-packet">
      <animateMotion path="M -20 -30 L -50 0" dur="1.9s" repeatCount="indefinite" />
    </circle>

    <!-- Nodes -->
    <circle cx="60" cy="-40" class="node" style="animation-delay: 0.2s;" />
    <circle cx="60" cy="40" class="node" style="animation-delay: 1.2s;" />
    <circle cx="20" cy="0" class="node" style="animation-delay: 0.7s;" />
    <circle cx="-20" cy="-30" class="node" style="animation-delay: 1.7s;" />
    <circle cx="-20" cy="30" class="node" style="animation-delay: 0.4s;" />
    <circle cx="-50" cy="0" class="node" style="animation-delay: 2.2s;" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(400, 120)">
    <text x="0" y="0" class="title">AI-POWERED PROJECTS</text>
    <text x="0" y="40" class="subtitle">MACHINE LEARNING • NEURAL NETWORKS • NLP</text>
    
    <!-- Animated AI Skill Tags -->
    <g transform="translate(0, 90)">
      <!-- PyTorch Tag -->
      <rect x="-265" y="-20" width="90" height="28" fill="#13102b" stroke="#312260" stroke-width="1.5" rx="6" opacity="0">
         <animate attributeName="opacity" to="1" dur="0.5s" begin="1s" fill="freeze" />
      </rect>
      <text x="-220" y="-1" class="tag" style="fill: #ee4c2c;">PyTorch</text>
      
      <!-- TensorFlow Tag -->
      <rect x="-155" y="-20" width="90" height="28" fill="#13102b" stroke="#312260" stroke-width="1.5" rx="6" opacity="0">
         <animate attributeName="opacity" to="1" dur="0.5s" begin="1.2s" fill="freeze" />
      </rect>
      <text x="-110" y="-1" class="tag" style="fill: #ff6f00; animation-delay: 1.2s;">TensorFlow</text>
      
      <!-- LLM Tag -->
      <rect x="-45" y="-20" width="90" height="28" fill="#13102b" stroke="#312260" stroke-width="1.5" rx="6" opacity="0">
         <animate attributeName="opacity" to="1" dur="0.5s" begin="1.4s" fill="freeze" />
      </rect>
      <text x="0" y="-1" class="tag" style="fill: #00f2fe; animation-delay: 1.4s;">LLMs &amp; RAG</text>
      
      <!-- OpenCV Tag -->
      <rect x="65" y="-20" width="90" height="28" fill="#13102b" stroke="#312260" stroke-width="1.5" rx="6" opacity="0">
         <animate attributeName="opacity" to="1" dur="0.5s" begin="1.6s" fill="freeze" />
      </rect>
      <text x="110" y="-1" class="tag" style="fill: #5cbf2a; animation-delay: 1.6s;">OpenCV</text>
      
      <!-- GenAI Tag -->
      <rect x="175" y="-20" width="90" height="28" fill="#13102b" stroke="#312260" stroke-width="1.5" rx="6" opacity="0">
         <animate attributeName="opacity" to="1" dur="0.5s" begin="1.8s" fill="freeze" />
      </rect>
      <text x="220" y="-1" class="tag" style="fill: #f093fb; animation-delay: 1.8s;">GenAI</text>
    </g>
  </g>

</svg>
